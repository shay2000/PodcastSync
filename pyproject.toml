[project]
name = "podcastsync"
version = "0.1.0"
description = "Turn YouTube channels and playlists into self-hosted podcast feeds"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "google-api-python-client>=2.100.0",
    "feedparser>=6.0.10",
    "yt-dlp>=2024.01.01",
    "feedgen>=1.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
# Test-only. Deliberately kept out of `dependencies` so the PyInstaller bundle
# is unchanged — see scripts/build_backend.sh.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.scripts]
podcastsync = "backend.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Scoped to tests/ so pytest does not collect backend/test_fetch.py, which is a
# manual CLI script rather than a test module.
testpaths = ["tests"]
